<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>忠孝分校 資教AI智慧管理儀表板</title>
<style>
:root{--ink:#16263f;--muted:#6b7a90;--line:#e1e8f0;--bg:#f2f5fa;--card:#fff;--blue:#2457a6;--green:#12805a;--amber:#b7791f;--red:#c0392b;--soft:#eef3f9;--inp:#fffbe6;--okbg:#e2f5ec;--badbg:#fbe5e2;--warnbg:#fbf1d9;--shadow:0 1px 2px rgba(20,40,80,.06),0 4px 14px rgba(20,40,80,.05);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e6edf7;--muted:#9aa9bd;--line:#2a394e;--bg:#0e1723;--card:#15212f;--blue:#6aa0f0;--green:#3ecf94;--amber:#f0b252;--red:#ff7b6b;--soft:#1c2b3d;--inp:#2a2a18;--okbg:#14382b;--badbg:#412320;--warnbg:#3b3017;--shadow:none}}
:root[data-theme="dark"]{--ink:#e6edf7;--muted:#9aa9bd;--line:#2a394e;--bg:#0e1723;--card:#15212f;--blue:#6aa0f0;--green:#3ecf94;--amber:#f0b252;--red:#ff7b6b;--soft:#1c2b3d;--inp:#2a2a18;--okbg:#14382b;--badbg:#412320;--warnbg:#3b3017;--shadow:none}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif;line-height:1.55}
header{background:linear-gradient(120deg,#17452f,#3b8f47);color:#fff;padding:22px clamp(14px,4vw,40px) 26px}
.hd{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.brand{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.logo{background:#fff;border-radius:16px;padding:6px 12px;box-shadow:0 2px 10px rgba(0,0,0,.18)}.logo img{display:block;height:60px;width:auto}
h1{margin:0;font-size:23px;letter-spacing:.5px}h1 small{font-weight:400;opacity:.7;font-size:15px}header p{margin:5px 0 0;color:#d9f0dc;font-size:13px;max-width:640px}
.pill{background:rgba(255,255,255,.16);padding:5px 12px;border-radius:99px;font-size:12px}.pill.er{background:#7a2a22}
main{max-width:1180px;margin:-14px auto 0;padding:0 clamp(12px,3vw,24px) 40px}
.bar,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.bar label{font-size:13px;color:var(--muted)}
input,select,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 10px;max-width:100%}
input.e,select.e{background:var(--inp)}input.n{width:92px}
button{cursor:pointer;transition:.15s}button:hover:not(:disabled){border-color:var(--blue)}button.pri,button.sv{background:var(--blue);color:#fff;border-color:var(--blue)}button:disabled,input:disabled,select:disabled{opacity:.5;cursor:not-allowed}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:99px;box-shadow:var(--shadow)}
.tabs button{white-space:nowrap;border:0;background:transparent;border-radius:99px;padding:8px 16px;color:var(--muted)}.tabs button.on{background:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.m{padding:12px 14px;border-left:4px solid var(--line);margin:0}.m small{color:var(--muted);font-size:12px}.m b{display:block;font-size:26px;line-height:1.2;margin-top:2px}
.m.ok{border-left-color:var(--green)}.m.bad{border-left-color:var(--red)}.m.warn{border-left-color:var(--amber)}.m.na{border-left-color:var(--muted)}
h2{font-size:16px;margin:0 0 12px}h3{font-size:14px;margin:14px 0 6px}.note{font-size:12px;color:var(--muted)}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px;min-width:680px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--soft);color:var(--muted);font-weight:600;font-size:12px}
tr:last-child td{border-bottom:0}
.t{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--soft)}
.ok{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.na{color:var(--muted)}
.bg{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.bg.ok{background:var(--okbg)}.bg.bad{background:var(--badbg)}.bg.warn{background:var(--warnbg)}.bg.na{background:var(--soft)}
.prog,.stk{height:9px;background:var(--soft);border-radius:9px;overflow:hidden;min-width:90px;display:flex}.prog i{display:block;height:100%;background:var(--green)}
.stk i{display:block;height:100%}.s-ok{background:var(--green)}.s-bad{background:var(--red)}.s-warn{background:var(--amber)}
.ring{width:104px;height:104px;border-radius:50%;background:conic-gradient(var(--green) calc(var(--p)*1%),var(--soft) 0);display:grid;place-items:center;flex:none}
.ring div{width:78px;height:78px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:22px;font-weight:700}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.hero h2{margin:0 0 4px}
pre{white-space:pre-wrap;word-break:break-word;font:13px/1.7 inherit;margin:0}
.empty,.ban{padding:12px;background:var(--soft);border-radius:10px;color:var(--muted);margin-bottom:14px}.ban.bad{color:var(--red)}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:6px}.form label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.chk{flex-direction:row!important;align-items:center;gap:5px!important;font-size:13px!important;color:var(--ink)!important}.chk input{width:17px;height:17px;padding:0}.foot{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:18px}.foot img{height:34px;opacity:.9}
[hidden]{display:none!important}.n2{width:64px}.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:4px;margin:6px 0}.dy{display:flex;gap:4px;align-items:center;font-size:12px;background:var(--soft);padding:3px 6px;border-radius:8px}.dy input[type=checkbox]{width:16px;height:16px;padding:0}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px;margin:6px 0}.slot{display:flex;gap:4px;align-items:center;font-size:12px}.slot b{width:26px;color:var(--muted)}
.rl{border-top:4px solid var(--blue)}
details summary{cursor:pointer;font-weight:600;margin-bottom:8px}
</style></head><body>
